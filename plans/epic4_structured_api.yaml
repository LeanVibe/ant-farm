version: 1
plan_id: epic4-structured-api
goal: "Adopt BrokerSendResult for explicit reliability semantics"

batches:
  - name: broker-contracts
    tasks:
      - type: edit
        file: tests/contracts/test_component_contracts.py
        apply: |
          Add BrokerSendResult contract tests for base and enhanced brokers:
          - Test that both boolean and structured result APIs work
          - Verify structured results include success, reason, and message_id
          - Ensure backward compatibility with existing boolean paths
    verify:
      - run: "uv run pytest -q tests/contracts/test_component_contracts.py"
    commit:
      message: "test(contracts): add BrokerSendResult API contracts"

  - name: orchestrator-adoption
    depends_on: ["broker-contracts"]
    tasks:
      - type: command
        run: "grep -n 'send_message_with_result' src/core/orchestrator.py"
        description: "Verify orchestrator already uses structured API"
    verify:
      - run: "grep -n 'send_message_with_result' src/core/orchestrator.py"
    commit:
      message: "feat(orchestrator): verify structured broker send results already implemented"

  - name: verify-backward-compatibility
    depends_on: ["orchestrator-adoption"]
    tasks:
      - type: command
        run: "uv run pytest -q tests/unit/test_message_broker_comprehensive.py --no-cov -v"
        description: "Run comprehensive broker tests to ensure no regressions"
    verify:
      - run: "uv run pytest -q tests/unit/test_message_broker_comprehensive.py"
    commit:
      message: "test(broker): verify structured API adoption maintains compatibility"